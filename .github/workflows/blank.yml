name: Daily Commit

on:
  schedule:
    - cron: '55 17 * * *' # Runs once per day at midnight (00:00 UTC)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Configure Git
      run: |
        git config --global user.name 'Your Name'
        git config --global user.email '22f1001316@ds.study.iitm.ac.in'

    - name: Make changes
      run: |
        echo "Daily commit" >> daily-commit.txt
        git add daily-commit.txt

    - name: Commit changes with 22f1001316@ds.study.iitm.ac.in
      run: |
        git commit -m "Daily commit"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
